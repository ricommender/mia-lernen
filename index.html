<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interaktive Lernquizze für Mathematik, Englisch und Französisch.">
  <title>Mia-Lernen</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    * { box-sizing: border-box; }
    body { background: #f4f6fb; color: #253047; margin: 0; padding: 24px; }
    main { max-width: 880px; margin: min(12vh, 100px) auto; text-align: center; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); margin-bottom: 12px; }
    .intro { color: #536179; font-size: 1.1rem; }
    .subjects { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; margin-top: 36px; }
    .subject { background: white; border-radius: 18px; padding: 32px 16px; box-shadow: 0 4px 16px #172b4d12; }
    .emoji { font-size: 42px; }
    .subject h2 { font-size: 1.3rem; }
    .subject a { display: inline-block; background: #355cde; color: white; padding: 12px 22px; border-radius: 10px; text-decoration: none; font-weight: 650; }
    .subject a:hover, .subject a:focus-visible { background: #2649bd; }
  </style>
</head>
<body>
  <main>
    <h1>Mia-Lernen</h1>
    <p class="intro">Wähle ein Fach und starte dein Lernquiz.</p>
    <div class="subjects">
      <section class="subject">
        <div class="emoji" aria-hidden="true">🔢</div>
        <h2>Mathematik</h2>
        <a href="mathe.html">Quizze öffnen</a>
      </section>
      <section class="subject">
        <div class="emoji" aria-hidden="true">📚</div>
        <h2>Englisch</h2>
        <a href="englisch.html">Quizze öffnen</a>
      </section>
      <section class="subject">
        <div class="emoji" aria-hidden="true">🇫🇷</div>
        <h2>Französisch</h2>
        <a href="franzoesisch.html">Quizze öffnen</a>
      </section>
    </div>
  </main>
</body>
</html>
